<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRIS">
  <meta name="application-name" content="IRIS">
  <title>IRIS</title>
  <link rel="apple-touch-icon" href="/health-/apple-touch-icon-v14.png">
  <link rel="apple-touch-icon-precomposed" href="/health-/apple-touch-icon-v14.png">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center}
    main{padding:28px}
    .iris{font-size:28px;font-weight:300;letter-spacing:.65em;margin-left:.65em}
    p{margin:28px auto 0;max-width:290px;color:rgba(255,255,255,.55);font-size:13px;line-height:1.55}
    small{display:block;margin-top:18px;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:.14em}
  </style>
  <script>
    addEventListener('DOMContentLoaded',()=>{
      const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      if (standalone) location.replace('/health-/?from=home');
    });
  </script>
</head>
<body>
  <main>
    <div class="iris">IRIS</div>
    <p>Эта страница специально сделана для установки на экран «Домой» без manifest и Service Worker.</p>
    <small>SAFARI → ПОДЕЛИТЬСЯ → НА ЭКРАН «ДОМОЙ»</small>
  </main>
</body>
</html>
