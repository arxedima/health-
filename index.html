<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRIS">
  <meta name="description" content="IRIS — живой интерфейс здоровья.">
  <link rel="manifest" href="./manifest.webmanifest?v=iris12">
  <link rel="icon" type="image/png" sizes="32x32" href="./iris-icon-32.png?v=iris12">
  <link rel="icon" type="image/png" sizes="192x192" href="./iris-icon-192.png?v=iris12">
  <link rel="apple-touch-icon" sizes="180x180" href="./iris-icon-180.png?v=iris12">
  <title>IRIS</title>
  <link rel="stylesheet" href="./styles.css?v=iris11">
</head>
<body>
<main id="app" class="app mode-home">
  <div class="noise" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <button id="soundToggle" class="icon-button sound-trigger locked" type="button" aria-label="Мрачная музыка и эффекты" aria-pressed="true">
      <span class="sound-dot"></span>
    </button>
    <div class="brand" aria-label="IRIS">I R I S</div>
    <button id="settingsTrigger" class="icon-button settings-trigger" type="button" aria-label="Настройки">••</button>
  </header>

  <section id="stage" class="stage" aria-label="Интерактивный глаз IRIS">
    <canvas id="irisCanvas"></canvas>
    <div id="touchRing" class="touch-ring" aria-hidden="true"></div>

    <div id="modeWhisper" class="mode-whisper">IRIS НАБЛЮДАЕТ</div>

    <div id="metric" class="metric">
      <div id="metricLabel" class="metric-label">ГЛАВНАЯ</div>
      <div id="metricValue" class="metric-value"></div>
      <div id="metricCaption" class="metric-caption">КОСНИСЬ ГЛАЗА</div>
    </div>

    <div id="radialMenu" class="radial-menu" aria-hidden="true">
      <div class="menu-orbit" aria-hidden="true"></div>
      <button class="radial-item radial-top" data-mode="sport" type="button"><span>СПОРТ</span></button>
      <button class="radial-item radial-right" data-mode="food" type="button"><span>ПИТАНИЕ</span></button>
      <button class="radial-item radial-bottom" data-mode="sleep" type="button"><span>СОН</span></button>
      <button class="radial-item radial-left" data-mode="water" type="button"><span>ВОДА</span></button>
      <div class="radial-core" aria-hidden="true"></div>
    </div>

    <section id="insightPanel" class="insight-panel" aria-hidden="true">
      <div class="insight-eyebrow">СВОДКА ДНЯ</div>
      <div class="insight-title">СВЕТЛЕЕ КАЖДЫЙ ДЕНЬ</div>
      <div class="week-row" aria-label="Неделя">
        <span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span>
      </div>
      <div class="insight-stats">
        <div><strong>92</strong><span>Энергия</span></div>
        <div><strong>7:24</strong><span>Сон</span></div>
        <div><strong>1 420</strong><span>Ккал</span></div>
      </div>
    </section>
  </section>

  <footer id="motionHint" class="motion-hint">
    <span>КАСАНИЕ</span><i></i><span>УДЕРЖАНИЕ</span><i></i><span>СВАЙП</span>
  </footer>
  <div id="modeDots" class="mode-dots" aria-hidden="true"></div>

  <aside id="settingsPanel" class="settings" aria-hidden="true">
    <div class="settings-backdrop" data-close-settings></div>
    <div class="settings-sheet" role="dialog" aria-modal="true" aria-label="Настройки">
      <div class="settings-head">
        <span>НАСТРОЙКИ</span>
        <button class="icon-button close-settings" type="button" data-close-settings aria-label="Закрыть">×</button>
      </div>
      <nav class="settings-list">
        <button type="button">Профиль <b>›</b></button>
        <button type="button">Цели <b>›</b></button>
        <button type="button">Напоминания <b>›</b></button>
        <button id="soundSettings" class="setting-toggle" type="button"><span>Мрачная музыка и эффекты</span><em id="soundState">КОСНИСЬ</em></button>
        <button type="button">Здоровье <b>›</b></button>
        <button type="button">Внешний вид <b>›</b></button>
        <button type="button">Приватность <b>›</b></button>
        <button type="button">Данные <b>›</b></button>
      </nav>
      <div class="settings-note">v1.1: отдельный аудиоплеер для мрачной фоновой музыки и Web Audio для эффектов. На iPhone один раз коснись экрана.</div>
      <div class="settings-signature">I R I S<br><small>СПОКОЙНЕЕ ВНУТРИ · ЯСНЕЕ СНАРУЖИ</small></div>
    </div>
  </aside>
</main>
<script src="./iris-engine.js?v=iris10"></script>
<script>if(localStorage.getItem('irisSound')!=='off'){const b=document.getElementById('soundToggle');try{b&&b.click()}catch(e){}localStorage.setItem('irisSound','on')}</script>
<script src="./iris-v11.js?v=iris11"></script>
</body>
</html>
