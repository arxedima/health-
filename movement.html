<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Движение — Nova+</title>
<style>
:root{--bg:#f8f9fc;--card:#fff;--text:#153979;--muted:#8b9ab6;--line:#e9eef6;--blue:#1b55a0;--blue2:#438ae4;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;color:inherit;border:0}.app{max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(#fafbfe,#f5f7fb);padding-bottom:calc(92px + var(--safe-b));transition:.35s}.dark{--bg:#06152b;--card:#0c2341;--text:#f7fbff;--muted:#92a5c1;--line:rgba(255,255,255,.07);--blue:#77b5f3;--blue2:#ddecff}.dark .app{background:linear-gradient(#071a34,#051326)}
header{padding:calc(var(--safe-t) + 18px) 20px 4px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;letter-spacing:-.04em}.orb-logo{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 28% 23%,#fff 0 5%,transparent 14%),linear-gradient(145deg,#9ed8ff,#6ca9ef 42%,#7c85ef 72%,#ca8de8);box-shadow:inset 0 0 14px #ffffff66,0 8px 20px #5180c82a}.theme{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 22px #284b7a10;font-size:22px}.content{padding:14px 20px 24px}.date{font-size:14px;color:var(--muted);font-weight:650}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title h1{font-size:38px;line-height:.96;letter-spacing:-.055em;margin:9px 0 7px;font-weight:880}.title p{margin:0;color:var(--muted);font-size:16px;font-weight:560}.move-badge{width:44px;height:44px;border-radius:15px;background:#e9f3ff;color:#1c5cab;display:grid;place-items:center;margin-top:8px}.dark .move-badge{background:#11365e;color:#dcecff}.move-badge svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{height:315px;position:relative;display:grid;place-items:center;margin:4px 0 0}.ring{position:absolute;width:276px;height:276px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-linecap:round}.track{stroke:#e4edf8;stroke-width:8}.progress{stroke:var(--blue2);stroke-width:9;stroke-dasharray:66 100;filter:drop-shadow(0 2px 4px #2c76c62a)}.dark .track{stroke:#ffffff18}.sphere{width:220px;height:220px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#fff 0 5%,#ffffffaa 11%,transparent 23%),radial-gradient(circle at 66% 43%,#78a9d533,transparent 38%),linear-gradient(145deg,#edf8ff,#c5e0f7 43%,#9fc4e5 70%,#eef6fb);border:1px solid #fff;box-shadow:inset 0 0 34px #fff,inset -18px -24px 40px #6e9ac42b,0 18px 44px #5d8fbd20}.dark .sphere{background:radial-gradient(circle at 30% 22%,#f4fbff 0 4%,#b7ddff50 11%,transparent 22%),linear-gradient(145deg,#204d79,#15395f 54%,#071b34);border-color:#d7ebff18;box-shadow:inset 0 0 35px #8cc8f621,0 22px 48px #0006}.sphere:after{content:"";position:absolute;left:20px;right:20px;bottom:38px;height:44px;border-radius:50%;border-top:2px solid #ffffff77;filter:blur(.3px)}.hero-number{text-align:center;z-index:2}.hero-number strong{font-size:46px;display:block;letter-spacing:-.06em}.hero-number small{color:var(--muted);font-size:14px;font-weight:650}
.quick-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 8px;text-align:center;box-shadow:0 8px 22px #244b7910}.metric b{display:block;font-size:19px;letter-spacing:-.04em}.metric span{display:block;color:var(--muted);font-size:11px;margin-top:4px;font-weight:650}.primary{width:100%;height:58px;margin-top:13px;border-radius:20px;background:linear-gradient(#20579c,#133f79);color:#fff;font-size:17px;font-weight:780;box-shadow:0 10px 22px #1e539828}.dark .primary{background:#f4f9ff;color:#0d315c}.primary.active{background:#e8f1ff;color:#1b55a0}.dark .primary.active{background:#12385e;color:#e5f2ff}
.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.section-head h2{margin:0;font-size:25px;letter-spacing:-.04em}.section-head span{font-size:12px;color:var(--muted)}.list{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:0 17px;box-shadow:0 8px 24px #234c7d0d}.workout{width:100%;display:grid;grid-template-columns:48px 1fr 20px;gap:12px;align-items:center;padding:15px 0;background:transparent;text-align:left}.workout+.workout{border-top:1px solid var(--line)}.wi{width:48px;height:48px;border-radius:16px;background:#eaf3ff;color:#1b5eaa;display:grid;place-items:center}.dark .wi{background:#12365d;color:#ddecff}.wi svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.workout b{display:block;font-size:15px}.workout small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.chev{color:var(--muted);font-size:28px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;height:calc(76px + var(--safe-b));padding:7px 14px var(--safe-b);background:#fffffff7;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:center;z-index:30}.dark .nav{background:#06162cf7}.nav a,.nav button{background:none;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:700}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav .active{color:var(--text)}.plus{width:58px!important;height:58px;border-radius:50%;background:#1c56a2!important;color:#fff!important;font-size:31px!important;display:grid!important;place-items:center!important;margin:-19px auto 0;box-shadow:0 0 0 5px var(--bg),0 9px 20px #1a58a32b}.sheet{position:fixed;inset:0;background:#07122566;display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.show{display:flex}.sheet-card{width:min(430px,100%);background:var(--card);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + var(--safe-b));box-shadow:0 -16px 50px #06163133}.sheet-card h3{font-size:24px;margin:0 0 8px}.sheet-card p{color:var(--muted);margin:0 0 18px;line-height:1.45}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sheet-actions button{height:48px;border-radius:16px;background:#eaf3ff;color:#164f95;font-weight:750}.dark .sheet-actions button{background:#12385e;color:#eef7ff}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="orb-logo"></span><span>Nova+</span></div><button class="theme" id="theme" aria-label="Сменить тему">☀️</button></header>
<main class="content">
<div class="date" id="date"></div>
<div class="title-row"><div class="title"><h1>Движение</h1><p>Тело в движении — ум в порядке.</p></div><div class="move-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 4l2 3 3 1M10 8l3 2-2 4-4 2M11 14l3 5M7 16l-2 4"/><circle cx="12" cy="3" r="1.5"/></svg></div></div>
<section class="hero" aria-label="Прогресс движения"><svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="43" pathLength="100"/><circle class="progress" cx="50" cy="50" r="43" pathLength="100"/></svg><div class="sphere"><div class="hero-number"><strong>2/3</strong><small>Сегодня</small></div></div></section>
<div class="quick-metrics"><div class="metric"><b>4 320</b><span>Шагов</span></div><div class="metric"><b>28</b><span>Минут</span></div><div class="metric"><b>320</b><span>Ккал</span></div></div>
<button class="primary" id="start">▷ Начать тренировку</button>
<section class="section"><div class="section-head"><h2>Популярное</h2><span>Выбери ритм</span></div><div class="list">
<button class="workout" data-title="ЛФК · мягкое восстановление" data-desc="15 минут · спокойный темп · колено, спина, шея"><span class="wi"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg></span><span><b>ЛФК · мягкое восстановление</b><small>15 минут · спокойный темп</small></span><span class="chev">›</span></button>
<button class="workout" data-title="FULL BODY" data-desc="24 минуты · 6 упражнений · средняя нагрузка"><span class="wi"><svg viewBox="0 0 24 24"><path d="M5 8h14M7 5v6M17 5v6M4 12h16M7 13v6M17 13v6"/></svg></span><span><b>FULL BODY</b><small>24 минуты · 6 упражнений</small></span><span class="chev">›</span></button>
<button class="workout" data-title="Растяжка" data-desc="10 минут · мягкая мобильность всего тела"><span class="wi"><svg viewBox="0 0 24 24"><path d="M8 4c3 4 5 8 4 16M16 4c-3 4-5 8-4 16M5 12h14"/></svg></span><span><b>Растяжка</b><small>10 минут</small></span><span class="chev">›</span></button>
</div></section>
</main>
<nav class="nav"><a href="./index.html"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7M5 9v11h14V9"/></svg>Главная</a><a class="active" href="./movement.html"><svg viewBox="0 0 24 24"><path d="M13 4l2 3 3 1M10 8l3 2-2 4-4 2M11 14l3 5M7 16l-2 4"/><circle cx="12" cy="3" r="1.5"/></svg>Движение</a><button class="plus" id="plus" aria-label="Быстрые действия">+</button><a href="./nutrition.html"><svg viewBox="0 0 24 24"><path d="M8 3v8M5 3v5a3 3 0 006 0V3M16 3v18M20 3c0 5-4 6-4 6"/></svg>Питание</a><a href="./index.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Профиль</a></nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Тренировка"><div class="sheet-card"><h3 id="sheetTitle">Быстрые действия</h3><p id="sheetText">Выбери, что сделать сейчас.</p><div class="sheet-actions"><button id="sheetPrimary">Начать</button><button id="close">Закрыть</button></div></div></div>
<script>
const body=document.body, theme=document.getElementById('theme'),sheet=document.getElementById('sheet'),title=document.getElementById('sheetTitle'),text=document.getElementById('sheetText'),primary=document.getElementById('sheetPrimary');
function formatDate(){const d=new Date(),w=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return `${w[d.getDay()]}, ${d.getDate()} ${m[d.getMonth()]}`}
document.getElementById('date').textContent=formatDate();
function setTheme(dark){body.classList.toggle('dark',dark);theme.textContent=dark?'🌙':'☀️';localStorage.setItem('nova-theme',dark?'dark':'light')}
setTheme(localStorage.getItem('nova-theme')==='dark');theme.addEventListener('click',()=>setTheme(!body.classList.contains('dark')));
let active=null;document.querySelectorAll('.workout').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.title;title.textContent=active;text.textContent=b.dataset.desc;primary.textContent='Начать';sheet.classList.add('show')}));
document.getElementById('plus').addEventListener('click',()=>{active=null;title.textContent='Быстрые действия';text.textContent='Можно сразу перейти к питанию или начать короткую тренировку.';primary.textContent='Открыть питание';sheet.classList.add('show')});
document.getElementById('close').addEventListener('click',()=>sheet.classList.remove('show'));sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.classList.remove('show')});
primary.addEventListener('click',()=>{if(active){document.getElementById('start').textContent='⏸ Тренировка идёт';document.getElementById('start').classList.add('active');sheet.classList.remove('show')}else location.href='./nutrition.html'});
document.getElementById('start').addEventListener('click',e=>{const running=e.currentTarget.classList.toggle('active');e.currentTarget.textContent=running?'⏸ Тренировка идёт':'▷ Начать тренировку'});
</script>
</body>
</html>
