<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRIS">
  <meta name="application-name" content="IRIS">
  <title>IRIS</title>
  <link rel="icon" type="image/png" href="/health-/app-icon.png?v=19">
  <link rel="apple-touch-icon" href="/health-/app-icon.png?v=19">
  <link rel="apple-touch-icon-precomposed" href="/health-/app-icon.png?v=19">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center}
    main{padding:28px}
    img{width:96px;height:96px;border-radius:23px;display:block;margin:0 auto 24px}
    .iris{font-size:28px;font-weight:300;letter-spacing:.65em;margin-left:.65em}
    p{margin:24px auto 0;max-width:300px;color:rgba(255,255,255,.55);font-size:13px;line-height:1.55}
    small{display:block;margin-top:18px;color:rgba(255,255,255,.28);font-size:10px;letter-spacing:.14em}
  </style>
  <script>
    addEventListener('DOMContentLoaded',()=>{
      const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
      if(standalone) location.replace('/health-/?from=home&v=19');
    });
  </script>
</head>
<body>
  <main>
    <img src="/health-/app-icon.png?v=19" alt="IRIS">
    <div class="iris">IRIS</div>
    <p>Установи IRIS на экран «Домой».</p>
    <small>SAFARI → ПОДЕЛИТЬСЯ → НА ЭКРАН «ДОМОЙ»</small>
  </main>
</body>
</html>
