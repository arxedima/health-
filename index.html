<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IRIS" />
  <meta name="description" content="IRIS — живой интерфейс здоровья." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./iris-icon.svg" />
  <title>IRIS</title>
  <link rel="stylesheet" href="./styles.css?v=iris01" />
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <div class="ambient" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand" id="brand">I R I S</div>
      <button class="ghost-button settings-trigger" id="settingsTrigger" aria-label="Настройки">••</button>
    </header>
    <section class="stage" id="stage" aria-label="Интерактивный глаз IRIS">
      <canvas id="irisCanvas"></canvas>
      <div class="touch-ring" id="touchRing" aria-hidden="true"></div>
      <div class="metric" id="metric">
        <div class="metric-label" id="metricLabel">HOME</div>
        <div class="metric-value" id="metricValue"></div>
        <div class="metric-caption" id="metricCaption">TOUCH TO FOCUS</div>
      </div>
      <div class="radial-menu" id="radialMenu" aria-hidden="true">
        <button class="radial-item radial-top" data-mode="sport"><span>SPORT</span></button>
        <button class="radial-item radial-right" data-mode="food"><span>FOOD</span></button>
        <button class="radial-item radial-bottom" data-mode="sleep"><span>SLEEP</span></button>
        <button class="radial-item radial-left" data-mode="water"><span>WATER</span></button>
        <div class="radial-core"></div>
      </div>
    </section>
    <footer class="motion-hint" id="motionHint">
      <span>TAP</span><i></i><span>HOLD</span><i></i><span>SWIPE</span>
    </footer>
    <div class="mode-dots" id="modeDots" aria-label="Состояния IRIS"></div>
    <aside class="settings" id="settingsPanel" aria-hidden="true">
      <div class="settings-backdrop" data-close-settings></div>
      <div class="settings-sheet">
        <div class="settings-head">
          <span>SETTINGS</span>
          <button class="ghost-button" data-close-settings aria-label="Закрыть">×</button>
        </div>
        <nav class="settings-list">
          <button>Profile <b>›</b></button>
          <button>Goals <b>›</b></button>
          <button>Reminders <b>›</b></button>
          <button>Health <b>›</b></button>
          <button>Appearance <b>›</b></button>
          <button>Privacy <b>›</b></button>
          <button>Data <b>›</b></button>
        </nav>
        <div class="settings-signature">I R I S<br><small>A CALMER YOU LIVES WITHIN</small></div>
      </div>
    </aside>
  </main>
  <script src="./iris-engine.js?v=iris01"></script>
</body>
</html>
