<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="32%" cy="20%" r="95%">
      <stop offset="0" stop-color="#213c78"/>
      <stop offset="0.48" stop-color="#101c42"/>
      <stop offset="1" stop-color="#071126"/>
    </radialGradient>
    <radialGradient id="orb" cx="30%" cy="23%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.08" stop-color="#bdeeff"/>
      <stop offset="0.30" stop-color="#7fc9ff"/>
      <stop offset="0.56" stop-color="#7c82f8"/>
      <stop offset="0.78" stop-color="#a980ed"/>
      <stop offset="1" stop-color="#d68dcc"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="42" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7edfff" stop-opacity=".48"/>
      <stop offset=".5" stop-color="#7f7cff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c987f0" stop-opacity=".44"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="520" r="330" fill="#5d6eea" opacity=".16" filter="url(#soft)"/>
  <circle cx="512" cy="520" r="286" fill="none" stroke="url(#ring)" stroke-width="8" opacity=".75"/>
  <circle cx="512" cy="520" r="252" fill="url(#orb)" filter="url(#glow)"/>
